[project]
name = "openpi-client"
version = "0.1.0"
description = "Lightweight WebSocket client and LIBERO evaluation utilities for openpi05-bsp"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
    "msgpack>=1.0.5",
    "numpy>=1.22.4,<2.0.0",
    "pillow>=9.0.0",
    "typing-extensions>=4.12.2",
    "websockets>=11.0",
]

[project.urls]
Repository = "https://github.com/Siyuan-Xue/openpi05-bsp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["**/*_test.py", "**/conftest.py"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[tool.ruff]
line-length = 120
target-version = "py38"
