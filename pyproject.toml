[project]
name = "openpi"
version = "0.1.0"
description = "pi0.5 JAX training and LIBERO B-spline policy evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "einops>=0.8.0",
    "etils>=1.11.0",
    "filelock>=3.16.1",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "openpi-client",
    "optax>=0.2.4",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "pydantic>=2.10.6",
    "scipy==1.15.3",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm>=4.67.1",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "websockets>=11.0",
]


[project.urls]
Repository = "https://github.com/Siyuan-Xue/openpi05-bsp"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "pynvml>=12.0.0",
]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi-client = { workspace = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# These focused contracts intentionally exercise private helpers.
"scripts/libero_eval_test.py" = ["SLF001"]
"scripts/serve_policy_test.py" = ["SLF001"]
"tests/contracts/libero_host_contract_test.py" = ["E402", "SLF001"]
"src/openpi/policies/policy_seed_test.py" = ["SLF001"]
"src/openpi/training/bsp_dataset_test.py" = ["SLF001"]
"src/openpi/training/bsp_test.py" = ["SLF001"]
# The loader stub mirrors class-level attributes from the external dataset API.
"src/openpi/training/data_loader_test.py" = ["RUF012"]
# The simulator entry point must remain valid syntax in the isolated Python 3.8 environment.
"examples/libero/*.py" = ["UP006", "UP007", "UP035"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-m",
    "not manual and not network and not data and not gpu",
]
markers = [
    "manual: requires explicitly supervised execution.",
    "network: reaches an external network service.",
    "data: reads a real dataset or checkpoint.",
    "gpu: requires GPU infrastructure.",
]
testpaths = ["src/openpi", "scripts", "tests/contracts", "packages/openpi-client/src/openpi_client"]
