name: Lightweight CPU CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-cpu:
    name: Ruff and offline CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: true
      PYTHONPATH: src:packages/openpi-client/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx --from ruff==0.11.12 ruff check .
      - name: Ruff format
        run: uvx --from ruff==0.11.12 ruff format --check .
      - name: Run every offline CPU test selected by the default marker policy
        run: uv run --frozen pytest -q

  openpi-client:
    name: Isolated openpi-client tests (Python 3.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.8"
      - name: Install only openpi-client and its pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 ./packages/openpi-client
      - name: Run isolated openpi-client tests
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: >-
          python -m pytest packages/openpi-client/src/openpi_client -q
          --basetemp="$RUNNER_TEMP/openpi-client-pytest"
