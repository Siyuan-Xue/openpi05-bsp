name: Lightweight CPU CI
on:
  push:
  pull_request:

jobs:
  repository-contracts:
    name: Ruff and repository contracts
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: true
      PYTHONPATH: src:packages/openpi-client/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx --from ruff==0.8.6 ruff check .
      - name: Ruff format
        run: uvx --from ruff==0.8.6 ruff format --check .
      - name: Run stdlib-only repository contracts with pytest
        run: |
          uvx --from pytest==9.0.3 pytest -q --noconftest \
            tests/contracts/repository_slim_contract_test.py \
            tests/contracts/repository_documentation_contract_test.py \
            tests/contracts/core_runtime_slim_test.py \
            tests/contracts/libero_host_contract_test.py \
            src/openpi/training/runtime_paths_test.py \
            src/openpi/training/train_planning_test.py \
            scripts/compare_libero_phase1_test.py

  openpi-client:
    name: Isolated openpi-client tests (Python 3.8)
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install only openpi-client and its pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 ./packages/openpi-client
      - name: Run isolated openpi-client tests
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: >-
          python -m pytest packages/openpi-client/src/openpi_client -q
          --basetemp="$RUNNER_TEMP/openpi-client-pytest"
