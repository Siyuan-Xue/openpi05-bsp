name: Lightweight CPU CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-cpu:
    name: Ruff and offline CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: true
      PYTHONPATH: src:packages/openpi-client/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx --from ruff==0.11.12 ruff check .
      - name: Ruff format
        run: uvx --from ruff==0.11.12 ruff format --check .
      - name: Run every offline CPU test selected by the default marker policy
        run: uv run --frozen pytest -q

  openpi-client:
    name: Isolated openpi-client tests (Python 3.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"
      - name: Install only openpi-client and its pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 ./packages/openpi-client
      - name: Run isolated openpi-client tests
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: >-
          python -m pytest packages/openpi-client/src/openpi_client -q
          --basetemp="$RUNNER_TEMP/openpi-client-pytest"
