# Run with:
# docker compose -f examples/libero/compose.yml up --build
services:
  runtime:
    image: libero
    depends_on:
      - openpi_server
    build:
      context: ../..
      dockerfile: examples/libero/Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - type: bind
        source: ${BSP_REPO_DIR:?BSP_REPO_DIR must be an absolute path}
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BSP_EXPERIMENTS_DIR:?BSP_EXPERIMENTS_DIR must be an absolute path}
        target: /experiments
        read_only: false
        bind:
          create_host_path: false
    environment:
      - CLIENT_ARGS
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - MUJOCO_EGL_DEVICE_ID=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  openpi_server:
    image: openpi_server
    build:
      context: ../..
      dockerfile: scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host
    volumes:
      - type: bind
        source: ${BSP_REPO_DIR:?BSP_REPO_DIR must be an absolute path}
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BSP_EXPERIMENTS_DIR:?BSP_EXPERIMENTS_DIR must be an absolute path}
        target: /experiments
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BSP_OPENPI_CACHE_DIR:?BSP_OPENPI_CACHE_DIR must be an absolute path}
        target: /openpi_assets
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${BSP_JAX_CACHE_DIR:?BSP_JAX_CACHE_DIR must be an absolute path}
        target: /jax_cache
        read_only: false
        bind:
          create_host_path: false
    environment:
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - JAX_COMPILATION_CACHE_DIR=/jax_cache
      - IS_DOCKER=true

    # Comment out this block if not running on a machine with GPUs.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
